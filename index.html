<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moti Bags — Gift Bag Collections</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #B8291E; --red-dark: #8B1A12; --red-deep: #3D0D08;
      --gold: #C9A84C; --gold-dark: #A8862A; --gold-lt: #F8F0DC;
      --bg: #FAFAF8; --bg-alt: #F4F1EC; --border: #E8E0D0;
      --text: #1A1008; --text-mid: #6B5B45; --text-lt: #999;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    .site-header {
      background: linear-gradient(135deg, var(--red-deep), #5C1810, var(--red-dark));
      padding: 1.8rem 1.5rem 2rem; text-align: center;
      border-bottom: 2px solid var(--gold);
    }
    .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 0.6rem; }
    .logo-text { font-family: 'Inter', sans-serif; font-size: 1.7rem; font-weight: 800; }
    .logo-text .lm { color: var(--red); -webkit-text-stroke: 1px rgba(255,255,255,0.3); }
    .logo-text .lb { color: var(--gold); }
    .header-tagline { font-size: 0.75rem; color: rgba(255,255,255,0.45); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 0.7rem; }
    .header-title { font-family: 'Playfair Display', serif; font-size: clamp(1.3rem,4vw,2rem); color: white; font-weight: 700; }

    /* BODY */
    .page-body { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.2rem 5rem; }

    /* GRID */
    .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; }

    /* CARD */
    .bag-card {
      background: white; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .bag-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.11); }
    .card-img {
      width: 100%; aspect-ratio: 1; background: var(--bg-alt);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 1rem; }
    .card-name { font-size: 0.9rem; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: 4px; }
    .card-price { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; color: var(--red); margin-bottom: 0.85rem; }
    .btn-enquire {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      width: 100%; background: #25D366; color: white; font-size: 0.82rem; font-weight: 700;
      padding: 10px; border-radius: 8px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: background 0.2s;
    }
    .btn-enquire:hover { background: #1da851; }

    /* EMPTY */
    .empty-state { text-align: center; padding: 5rem 2rem; }
    .empty-state h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text); }
    .empty-state p { color: var(--text-mid); font-size: 0.9rem; }
    .empty-icon { opacity: 0.18; margin: 0 auto 1rem; display: block; }

    /* MODAL */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .modal-bg.open { opacity: 1; pointer-events: all; }
    .modal-box {
      background: white; border-radius: 20px; padding: 2rem 1.8rem;
      width: 100%; max-width: 360px; border-top: 4px solid var(--gold);
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    }
    .modal-box h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--red-dark); margin-bottom: 0.25rem; }
    .modal-box .m-sub { font-size: 0.82rem; color: var(--text-mid); margin-bottom: 1.4rem; line-height: 1.5; }
    .m-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 0.85rem; }
    .m-field label { font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .m-field input {
      padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none;
      transition: border-color 0.2s; background: var(--bg);
    }
    .m-field input:focus { border-color: var(--red); background: white; }
    .btn-wa-submit {
      width: 100%; background: #25D366; color: white; font-size: 0.95rem; font-weight: 700;
      padding: 13px; border-radius: 50px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; display: flex; align-items: center;
      justify-content: center; gap: 8px; margin-top: 0.4rem;
    }
    .btn-wa-submit:hover { background: #1da851; }
    .m-cancel { display: block; text-align: center; margin-top: 0.9rem; font-size: 0.8rem; color: var(--text-lt); cursor: pointer; }
    .m-cancel:hover { color: var(--text); }

    @media (max-width: 480px) {
      .collection-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
      .card-body { padding: 0.75rem; }
      .card-name { font-size: 0.82rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a href="#" class="logo">
    <svg width="28" height="32" viewBox="0 0 30 34" fill="none">
      <path d="M9 13 C9 6 21 6 21 13" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="2" y="12" width="26" height="20" rx="3" fill="none" stroke="#C9A84C" stroke-width="2"/>
      <line x1="2" y1="20" x2="28" y2="20" stroke="#B8291E" stroke-width="1.2" stroke-opacity="0.6"/>
    </svg>
    <div class="logo-text"><span class="lm">Moti</span><span class="lb">Bags</span></div>
  </a>
  <div class="header-tagline">Gift Bag Collections</div>
  <h1 class="header-title">Browse Our Collections</h1>
</header>

<div class="page-body">
  <div class="collection-grid" id="collectionGrid"></div>
</div>

<!-- Contact Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal-box">
    <h3>Enquire on WhatsApp</h3>
    <p class="m-sub">Share your name and number — we'll confirm availability and pricing right away.</p>
    <div class="m-field">
      <label>Your Name *</label>
      <input type="text" id="m-name" placeholder="e.g. Priya Sharma"/>
    </div>
    <div class="m-field">
      <label>Phone Number *</label>
      <input type="tel" id="m-phone" placeholder="e.g. 9876543210"/>
    </div>
    <button class="btn-wa-submit" onclick="submitContact()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      Open WhatsApp
    </button>
    <span class="m-cancel" onclick="closeModal()">Cancel</span>
  </div>
</div>

<script>
  const WA      = '919741119072';
  const DATA_KEY = 'motibags_items';
  let pendingBag = null;

  function getData() {
    try { return JSON.parse(localStorage.getItem(DATA_KEY) || '[]'); } catch(e) { return []; }
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const BAG_PLACEHOLDER = `<svg width="52" height="52" viewBox="0 0 30 34" fill="none"><path d="M9 13 C9 6 21 6 21 13" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/><rect x="2" y="12" width="26" height="20" rx="3" stroke="#C9A84C" stroke-width="2"/></svg>`;
  const WA_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;

  function render() {
    const items = getData();
    const grid  = document.getElementById('collectionGrid');
    if (!items.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <svg class="empty-icon" width="72" height="72" viewBox="0 0 30 34" fill="none">
          <path d="M9 13 C9 6 21 6 21 13" stroke="#888" stroke-width="2" stroke-linecap="round"/>
          <rect x="2" y="12" width="26" height="20" rx="3" stroke="#888" stroke-width="2"/>
        </svg>
        <h2>Coming Soon</h2>
        <p>Our collection will be available here shortly.</p>
      </div>`;
      return;
    }
    grid.innerHTML = items.map(item => `
      <div class="bag-card">
        <div class="card-img">
          ${item.img
            ? `<img src="${esc(item.img)}" alt="${esc(item.name)}" onerror="this.parentElement.innerHTML='<div style=&quot;opacity:.25&quot;>${BAG_PLACEHOLDER}</div>'">`
            : `<div style="opacity:.25">${BAG_PLACEHOLDER}</div>`}
        </div>
        <div class="card-body">
          <div class="card-name">${esc(item.name)}</div>
          ${item.price ? `<div class="card-price">${esc(item.price)}</div>` : ''}
          <button class="btn-enquire" onclick="openModal('${esc(item.id)}')">
            ${WA_ICON} Enquire on WhatsApp
          </button>
        </div>
      </div>`).join('');
  }

  function openModal(itemId) {
    pendingBag = getData().find(i => i.id === itemId) || null;
    try {
      const c = JSON.parse(localStorage.getItem('mb_contact') || '{}');
      document.getElementById('m-name').value  = c.name  || '';
      document.getElementById('m-phone').value = c.phone || '';
    } catch(e) {}
    document.getElementById('modalBg').classList.add('open');
    setTimeout(() => document.getElementById('m-name').focus(), 100);
  }

  function closeModal() {
    document.getElementById('modalBg').classList.remove('open');
    pendingBag = null;
  }

  function submitContact() {
    const name  = document.getElementById('m-name').value.trim();
    const phone = document.getElementById('m-phone').value.trim();
    if (!name)  { document.getElementById('m-name').focus();  return; }
    if (!phone) { document.getElementById('m-phone').focus(); return; }

    localStorage.setItem('mb_contact', JSON.stringify({ name, phone }));
    saveLead(name, phone);

    let msg = `Hi Moti Bags!\n\nName: ${name}\nPhone: ${phone}\n\n`;
    if (pendingBag) {
      msg += `I'm interested in *${pendingBag.name}*${pendingBag.price ? ' (' + pendingBag.price + '/bag)' : ''}.\nPlease share availability and details. Thank you!`;
    } else {
      msg += `I would like to enquire about your bag collections. Please share details. Thank you!`;
    }
    closeModal();
    window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(msg), '_blank');
  }

  function saveLead(name, phone) {
    try {
      const leads = JSON.parse(localStorage.getItem('motibags_leads') || '[]');
      if (!leads.some(l => l.phone === phone)) {
        leads.push({ name, phone, time: new Date().toLocaleString('en-IN') });
        localStorage.setItem('motibags_leads', JSON.stringify(leads));
      }
    } catch(e) {}
  }

  document.getElementById('modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.getElementById('modalBg').classList.contains('open')) submitContact();
  });

  window.addEventListener('storage', e => { if (e.key === DATA_KEY) render(); });
  render();
</script>
</body>
</html>
